# Generated by Concourse Coach
resource_types:
  - name: dummy
    type: registry-image
    source:
      repository: raffaelhu/concourse-dummy-resource
      tag: "0.1"
      username: ((build.username))
      password: ((build.password))

resources:
  - name: repo
    type: git
    source:
      uri: https://github.com/OutOfContext/concourse-ci-examples.git
      branch: master
  - name: app-repo
    type: git
    source:
      uri: https://github.com/OutOfContext/demo-app.git
      branch: master
  - name: example
    type: dummy
    source: {}


jobs:
  - name: build_n_test
    plan:
      - in_parallel:
        - get: repo
        - get: example
        - get: app-repo
          trigger: true

      - in_parallel:
        - task: build_java
          file: repo/tasks/build/java/task.yml
          input_mapping:
            app: app-repo
          output_mapping:
            build: build_out
          timeout: 1m

        - task: test_java
          file: repo/tasks/test/java/task.yml
          input_mapping:
            app: app-repo
          timeout: 1m
