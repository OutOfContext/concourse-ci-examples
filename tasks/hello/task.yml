platform: linux

image_resource:
  type: registry-image
  source:
    repository: alpine
    tag: "3.20"

outputs:
  - name: out

params:
  MESSAGE: ((hello.myvaultsec))

run:
  path: sh
  args:
    - -ec
    - |
      if [ -n "$MESSAGE" ]; then
        echo "MESSAGE is set"
      else
        echo "MESSAGE is empty" >&2
        exit 1
      fi

      date -u
      echo "OK" > out/result.txt
      ls -la out
