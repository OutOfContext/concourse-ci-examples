platform: linux

image_resource:
  type: registry-image
  source:
    repository: maven
    tag: "3.9.9-eclipse-temurin-25"

inputs:
  - name: app

outputs:
  - name: build

run:
  path: sh
  args:
    - -ec
    - |
      cd app
      mvn -B -DskipTests package
      cp target/*.jar ../build/app.jar
